# Deploy target for the hosted demo: one Docker service, one URL.
#
# MODEL_API_KEY is deliberately not set here — add it in the dashboard so it never
# lands in the repository. Without it the deployment still serves the UI and the
# recorded debates; live debates return 503 with an explanation.
services:
  - type: web
    name: adversarial-debate-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_PROVIDER
        value: mistral
      # Set this in the dashboard, not here. One key or several, comma-separated:
      # with more than one the adapter rotates when a free tier runs out.
      - key: MODEL_API_KEYS
        sync: false
      # A reviewer will not wait six minutes. Short debate, short turns.
      - key: MAX_DEBATE_ROUNDS
        value: "4"
      - key: TURN_LENGTH_HINT
        value: "55 to 95 words"
      - key: REQUEST_MIN_INTERVAL
        value: "4"
